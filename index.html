<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Clara</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #000;
      color: white;
      padding: 20px;
    }
    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px;
    }
    .producto {
      border: 1px solid #ddd;
      width: 200px;
      padding: 10px;
    }
    .producto img {
      width: 100%;
    }
    .btn {
      background-color: black;
      color: white;
      padding: 10px;
      display: block;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Tienda Clara</h1>
  <p>Moda moderna y asequible</p>
</header>

<section class="productos">

  <div class="producto">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Camiseta Essential</h3>
    <p>15€</p>
    <a class="btn" href="https://wa.me/34670 88 64 29">Comprar</a>
  </div>

  <div class="producto">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Vestido Elegance</h3>
    <p>29€</p>
    <a class="btn" href="https://wa.me/34670 88 64 29">Comprar</a>
  </div>

  <div class="producto">
    <img src="https://via.placeholder.com/200" alt="">
    <h3>Sudadera Oversize</h3>
    <p>25€</p>
    <a class="btn" href="https://wa.me/34670 88 64 29">Comprar</a>
  </div>

</section>

</body>
</html>
